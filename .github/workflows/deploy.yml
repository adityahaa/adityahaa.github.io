name: Deploy reviewed portfolio
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://adityahaa.github.io/
    steps:
      - uses: actions/checkout@v7
      - name: Verify and extract approved source
        run: |
          echo "17df793ebcab2997aaf7662d1df5b709ecf13e505c82ccb665918c2c00fc2aa6  aditya-hambire-portfolio-source.zip" | sha256sum --check
          unzip -q aditya-hambire-portfolio-source.zip
      - name: Check, build, audit and upload
        uses: withastro/action@v6
        with:
          path: portfolio
          node-version: 24
          package-manager: pnpm@11.25.0
          build-cmd: pnpm run check && pnpm run build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static output
        id: deployment
        uses: actions/deploy-pages@v5
