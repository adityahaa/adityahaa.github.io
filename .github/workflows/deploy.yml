name: Deploy reviewed portfolio
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://adityahaa.github.io/
    steps:
      - uses: actions/checkout@v7
      - name: Verify and extract approved source
        run: |
          echo "04ab9e3b578d49773fa92ee5441ff78a2620bf1ad5d0598201375567e596eaec  aditya-hambire-portfolio-source.zip" | sha256sum --check
          unzip -q aditya-hambire-portfolio-source.zip
      - name: Check, build, audit and upload
        uses: withastro/action@v6
        with:
          path: portfolio
          node-version: 24
          package-manager: pnpm@11.25.0
          build-cmd: pnpm run check && pnpm run build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static output
        id: deployment
        uses: actions/deploy-pages@v5
